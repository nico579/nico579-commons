[build-system]
# setuptools 77 : première version qui lit une licence en expression SPDX.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nico579-commons"
version = "0.6.1"
description = "Briques communes à blink2video, lidar2map, watch2notif et gpxsolar"
readme = "README.md"
# Expression SPDX (PEP 639), comme gpx2elev. L'ancienne table {text = ...} et le
# classifieur « License :: » sont dépréciés : setuptools refusera de construire
# cette forme après le 2027-02-18. Le fichier LICENSE est inclus d'office.
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
# La bibliothèque seule n'exige rien : relance, raccourci, maj, environnement et
# enfants n'emploient que la bibliothèque standard. Seule l'icône (nico579_commons.tray)
# a besoin de pystray et de Pillow, d'où l'extra « tray » ; une application qui
# n'en veut pas, ou qui les déclare déjà elle-même, ne les tire pas de force.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# jeepney : bibliothèque D-Bus en Python pur, pour l'icône StatusNotifierItem
# (GNOME Wayland, KDE) que pystray n'ouvre pas sans GTK ; Linux seulement.
tray = ["pystray>=0.19", "Pillow", "jeepney>=0.8; sys_platform == 'linux'"]

[project.urls]
Source = "https://github.com/nico579/nico579-commons"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nico579_commons = ["*.js"]

[tool.ruff.lint]
select = ["F"]
