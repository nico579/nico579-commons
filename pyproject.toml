[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nico579-commons"
version = "0.2.0"
description = "Briques communes à blink2video, lidar2map, watch2notif et gpxsolar"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.8"
dependencies = ["pystray>=0.19", "Pillow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/nico579/nico579-commons"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F"]
